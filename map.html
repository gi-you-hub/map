<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    .map-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .map-container iframe {
      position: absolute;
      /* 上のヘッダー（約60px）と左の白枠（約10px）を上に引っ張り上げて画面外に追い出す */
      top: -100px;
      left: -10px;
      /* はみ出させた分だけ幅と高さを広げる */
      width: calc(100% + 20px);
      height: calc(100% + 100px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="map-container">
    <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1Bqh2RqtuXKK_a1LHbTiyjLv6V_vAmyg&ehbc=2E312F"></iframe>
  </div>
</body>
</html>
